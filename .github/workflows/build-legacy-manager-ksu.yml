name: Build C3U APK (compile + embed KernelSU)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-embed-kernelsu:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Check legacy first stage and integrated-build invariants
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_legacy_first_stage.py' -v
          python3 -m unittest discover -s tests -p 'test_legacy_manager_ksu.py' -v
          python3 -m unittest discover -s tests -p 'test_tested_ref_module_build.py' -v
          python3 -m unittest discover -s tests -p 'test_c3u_autobuilt_apk.py' -v
          python3 -m unittest discover -s tests -p 'test_c3u_foreground_service.py' -v
          bash -n tools/build-c3u-autobuilt-apk.sh
          bash -n tools/build-ksunext-tested-ref-candidate.sh
          bash -n tools/build-legacy-manager-ksu.sh
          bash -n patches/ksunext/tested-revision/build-in-docker.sh

      - name: Compile pinned KernelSU module and embed it into legacy DFRoot APK
        run: bash tools/build-c3u-autobuilt-apk.sh

      - name: Verify final APK contains the just-built module
        run: |
          python3 tools/verify-c3u-autobuilt-apk.py \
            --apk dist-legacy-manager-ksu/DFRoot-C3U-AUTOBUILT-KSUNEXT-UNVERIFIED.apk \
            --ko dist-ksunext-reference/KernelSU-Next-C3U-REBUILT-UNVERIFIED-DO-NOT-LOAD.ko \
            --manifest dist-legacy-manager-ksu/build-manifest.json

      - name: Upload rebuilt-module APK and comparison report
        uses: actions/upload-artifact@v4
        with:
          name: c3u-AUTOBUILT-KSU-IN-APK-${{ github.run_id }}
          path: |
            dist-legacy-manager-ksu/
            dist-ksunext-reference/
          if-no-files-found: error
          retention-days: 30
