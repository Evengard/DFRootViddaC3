name: Build C3U candidates
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ksu_ref_override:
        description: 'Optional KernelSU Next tag for a one-off candidate build (e.g. v3.5.0)'
        required: false
        type: string
      use_known_good:
        description: 'Embed optional known-good .ko instead of compiling a new KSU module'
        required: false
        default: false
        type: boolean
      tv_settings:
        description: 'Add experimental Android TV Settings button to DFRoot'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ksu_ref_override:
        type: string
        required: false
        default: ''
      use_known_good:
        type: boolean
        required: false
        default: false
      tv_settings:
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: c3u-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-checks:
    name: Offline checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate local patch sources and upstream lockfile
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/validate-repo.py
          python3 tools/check-patchset.py
          python3 -m py_compile tools/inspect_dfroot_root_flow.py tools/check-patchset.py tools/verify-apk-native.py
          bash -n tools/build-all.sh
          bash -n tools/adb-root-c3u.sh
          bash -n patches/dfroot/build-and-bundle.sh
          bash -n patches/dfroot/build-in-docker.sh
          bash -n patches/dfroot/build-native-in-docker.sh
          bash -n patches/ksunext/build-module.sh
          bash -n patches/ksunext/build-kmod-in-docker.sh
  build:
    name: Compile module and APK (not device tested)
    needs: offline-checks
    # Avoid running Docker builds originating from outside/forked PR code.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      C3U_KSU_REF_OVERRIDE: ${{ inputs.ksu_ref_override || '' }}
      C3U_USE_KNOWN_GOOD: ${{ inputs.use_known_good && '1' || '0' }}
      C3U_ENABLE_TV_SETTINGS: ${{ inputs.tv_settings && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx for cached Android SDK image
        uses: docker/setup-buildx-action@v3
      - name: Restore Gradle and one-KMI module caches
        uses: actions/cache/restore@v4
        id: c3u-build-cache
        with:
          path: |
            .ci-cache/gradle
            .ci-cache/dfroot-ko
          key: ${{ runner.os }}-c3u-build-v5-${{ hashFiles('patches/dfroot/**', 'config/upstreams.json') }}
          restore-keys: |
            ${{ runner.os }}-c3u-build-v5-
      - name: Free Android/SDK image disk space (SDK lives in Docker)
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell || true
          df -h /
      - name: Docker compilation of C3U-only KernelSU and DFRoot APK
        run: ./tools/build-all.sh
      - name: Save Gradle and one-KMI module caches (also on failed builds)
        uses: actions/cache/save@v4
        if: always() && steps.c3u-build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            .ci-cache/gradle
            .ci-cache/dfroot-ko
          key: ${{ steps.c3u-build-cache.outputs.cache-primary-key }}
      - name: Upload candidate artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3u-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
          retention-days: 30
          if-no-files-found: warn
